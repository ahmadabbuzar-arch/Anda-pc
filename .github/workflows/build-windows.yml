
name: Build ANDA CART Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Part 1
        run: Expand-Archive ANDA-CART-Part-1.zip part1

      - name: Extract Part 2
        run: Expand-Archive ANDA-CART-Part-2.zip part2

      - name: Restore project files
        shell: pwsh
        run: |
          Copy-Item part1/* . -Recurse -Force

      - name: Join HTML parts
        shell: cmd
        run: |
          copy /b part1\game-src\game-part-1.bin+part2\game-src\game-part-2.bin game-src\Anda_Cart_PC__1__2.html

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build EXE
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: ANDA-CART-Windows
          path: dist/*.exe
