
name: Build ANDA CART Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Part 1
        shell: pwsh
        run: Expand-Archive -Path "ANDA-CART-Part-1.zip" -DestinationPath "part1" -Force

      - name: Extract Part 2
        shell: pwsh
        run: Expand-Archive -Path "ANDA-CART-Part-2.zip" -DestinationPath "part2" -Force

      - name: Restore project files
        shell: pwsh
        run: |
          Copy-Item "part1/*" "." -Recurse -Force

      - name: Join HTML parts
        shell: cmd
        run: |
          copy /b part1\game-src\game-part-1.bin+part2\game-src\game-part-2.bin game-src\Anda_Cart_PC__1__2.html

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npm run build -- --publish never

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ANDA-CART-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 7
